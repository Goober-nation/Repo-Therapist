syntax = "proto3";

package rating;

option go_package = "rating-service/internal/transport/gen;pb";

import "google/protobuf/timestamp.proto";

service Rating {
  // GetRanking returns one page of the public repositories ranking. Read-only — the rating
  // service never writes to the DB.
  rpc GetRanking(GetRankingRequest) returns (GetRankingResponse);
  // GetPublicScore returns the stored public score of one public repository, for the README
  // badge. Read-only: it never starts a grading. NOT_FOUND when the repo is unknown or not public.
  rpc GetPublicScore(GetPublicScoreRequest) returns (GetPublicScoreResponse);
  // GetPublicSummary returns the stored public grade of one public repository with its category
  // scores, for the public score API and the README badges/widget. Read-only: it never starts a
  // grading. NOT_FOUND when the repo is unknown or not public.
  rpc GetPublicSummary(GetPublicSummaryRequest) returns (GetPublicSummaryResponse);
}

enum SortBy {
  // Zero value, so an omitted sort_by also means score.
  SORT_BY_SCORE = 0;
  SORT_BY_LAST_ACTIVITY = 1;
  SORT_BY_LIKES = 2;
}

message GetRankingRequest {
  // 1-based page number; 0 means the first page.
  int32 page = 1;
  // Entries per page; 0 means the default (20), max 100.
  int32 page_size = 2;
  // Primary language filter, matched case-insensitively. Empty means all languages.
  string language = 3;
  // Always descending, NULLs last. Ties are broken by public_score, so health stays the dominant
  // ranking factor whichever sort is chosen.
  SortBy sort_by = 4;
  // Leave out repos whose public grade is marked low-confidence. Repos without a flag row
  // (unknown) are never left out.
  bool hide_low_confidence = 5;
}

message RankingEntry {
  // Position within the current filtered and sorted list: (page-1)*page_size + index + 1.
  int32 place = 1;
  string sourcecraft_uuid = 2;
  // Currently repo_slug — repos has no display name column yet.
  string name = 3;
  // Empty when unknown.
  string web_url = 4;
  // Unset when the repo has not been graded yet ("нет данных").
  optional int32 public_score = 5;
  // SourceCraft rating value (likes). Unset when unknown.
  optional double likes = 6;
  // Always set; name and color are empty strings when unknown.
  Language language = 7;
  // Unset when unknown.
  google.protobuf.Timestamp last_activity_at = 8;
  // Low-confidence flag of the public grade. Unset when unknown (grade stored before the flag).
  optional bool low_confidence = 9;
  // Generic pre-written reasons; empty unless low_confidence is true.
  repeated ConfidenceReason confidence_reasons = 10;
}

message Language {
  string name = 1;
  string color = 2;
}

message GetRankingResponse {
  repeated RankingEntry entries = 1;
  // Number of repos matching the filter across all pages.
  int32 total_count = 2;
  // Effective page and page_size after defaults were applied.
  int32 page = 3;
  int32 page_size = 4;
}

message GetPublicScoreRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message GetPublicScoreResponse {
  // Unset when the repo has not been graded yet.
  optional int32 public_score = 1;
}

message GetPublicSummaryRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message CategoryScore {
  // Category ID as stored by grade-service (activity, issues, documentation, code_health).
  string id = 1;
  // 0-100. Unset when the category has no data ("нет данных"), which is not a bad score.
  optional int32 score = 2;
}

message GetPublicSummaryResponse {
  // Currently repo_slug.
  string name = 1;
  // Empty when unknown.
  string web_url = 2;
  // Unset when the repo has not been graded yet.
  optional int32 public_score = 3;
  // Sorted by id; empty when the repo has not been graded yet.
  repeated CategoryScore categories = 4;
  repeated string missing_data = 5;
  // Unset when the repo has not been graded yet.
  google.protobuf.Timestamp graded_at = 6;
  // Unset when unknown (no flag row).
  optional bool low_confidence = 7;
  repeated ConfidenceReason confidence_reasons = 8;
}

message ConfidenceReason {
  string code = 1;
  string text = 2;
}
