syntax = "proto3";

package aggregator;

option go_package = "gateway-service/internal/transport/rpc/gen/agg;agg";

import "google/protobuf/timestamp.proto";

service Aggregator {
  rpc GetMyRepos(GetMyReposRequest)
      returns (GetMyReposResponse);

  // GetMyOrgs lists the caller's organizations and the one to open first.
  rpc GetMyOrgs(GetMyOrgsRequest)
      returns (GetMyOrgsResponse);

  // GetOrgRepos returns one batch of an organization's repos visible to the caller.
  rpc GetOrgRepos(GetOrgReposRequest)
      returns (GetOrgReposResponse);

  rpc GetGrading(GetGradingRequest)
      returns (GetGradingResponse);

  rpc RequestLLMRecommendations(RequestLLMRecommendationsRequest)
      returns (RequestLLMRecommendationsResponse);
  rpc GetAnalytics(GetAnalyticsRequest) returns (GetAnalyticsResponse);
  // GetRegradeStatus reports the scheduled public regrade (on/off, next run, progress). Read-only.
  rpc GetRegradeStatus(GetRegradeStatusRequest) returns (GetRegradeStatusResponse);

  // RecordAudit stores one audit event (docs/admin.md). The caller computes actor_hash from the
  // Yandex ID, so a raw ID never reaches the Aggregator. INVALID_ARGUMENT for an event that breaks
  // the audit rules.
  rpc RecordAudit(RecordAuditRequest) returns (RecordAuditResponse);
  // ListAudit returns one page of the audit log, newest first, with a cursor for the next page.
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // PreviewGradingBatch is the dry run of an admin batch grading: how many public repos a filter
  // matches and the limit takes, a sample, the hand-picked ones that matched nothing and a rough duration. Writes nothing.
  // INVALID_ARGUMENT for a filter that breaks the rules.
  rpc PreviewGradingBatch(PreviewGradingBatchRequest) returns (PreviewGradingBatchResponse);
  // StartGradingBatch creates a batch and starts it. ALREADY_EXISTS (batch_active) while another batch
  // is running or paused; INVALID_ARGUMENT (invalid_filter | nothing_selected |
  // limit_too_high) for a bad filter, one that selects nothing or a limit above the stand's cap. The start is recorded in the audit log
  // under actor_hash.
  rpc StartGradingBatch(StartGradingBatchRequest) returns (StartGradingBatchResponse);
  // ControlGradingBatch pauses, resumes or cancels a batch. ABORTED (bad_state) when the action does
  // not fit the batch's state, NOT_FOUND (batch_not_found) for an unknown batch.
  rpc ControlGradingBatch(ControlGradingBatchRequest) returns (ControlGradingBatchResponse);
  // GetGradingBatch returns a batch and the repos that failed in it. batch_id 0 means the active
  // batch, or the latest one when none is active; NOT_FOUND when there has never been one.
  rpc GetGradingBatch(GetGradingBatchRequest) returns (GetGradingBatchResponse);
  // ListGradingBatches returns the most recent batches, newest first.
  rpc ListGradingBatches(ListGradingBatchesRequest) returns (ListGradingBatchesResponse);

  // GetCatalogStatus reports the public repo catalog: its size and age, the running (or latest)
  // refresh and the one that produced the catalog in use. Read-only.
  rpc GetCatalogStatus(GetCatalogStatusRequest) returns (GetCatalogStatusResponse);
  // RefreshCatalog starts fetching the full public repo listing; the catalog in use stays until the
  // new one is complete. ALREADY_EXISTS (refresh_active) while a refresh is running. The start is
  // recorded in the audit log under actor_hash.
  rpc RefreshCatalog(RefreshCatalogRequest) returns (RefreshCatalogResponse);
  // CancelCatalogRefresh stops the running refresh; the catalog in use is untouched. ABORTED
  // (refresh_not_running) when none runs.
  rpc CancelCatalogRefresh(CancelCatalogRefreshRequest) returns (CancelCatalogRefreshResponse);
}

message GetRegradeStatusRequest {}

message GetRegradeStatusResponse {
  bool enabled = 1;
  int64 interval_seconds = 2;
  // Unset while the scheduled regrade is off.
  google.protobuf.Timestamp next_run_at = 3;
  bool running = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp last_finished_at = 6;
  // Repos of the current (or last) run; total is 0 until the list is loaded.
  int32 total = 7;
  int32 done = 8;
}

message GetMyReposRequest {}

message GetMyReposResponse {
  repeated Repository repositories = 1;
  string next_page_token = 2;
}

message GetMyOrgsRequest {}

message GetMyOrgsResponse {
  repeated UserOrganization organizations = 1;
  string default_org_slug = 2;
}

message UserOrganization {
  string slug = 1;
  string display_name = 2;
  bool personal = 3;
}

message GetOrgReposRequest {
  string org_slug = 1;
  string page_token = 2;
}

message GetOrgReposResponse {
  repeated Repository repositories = 1;
  string next_page_token = 2;
}

message GetGradingRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message GetGradingResponse {
  RepoGrade grade = 1;
}

message RequestLLMRecommendationsRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message RequestLLMRecommendationsResponse {
  bytes raw_response = 1;
  string model_used = 2;
  google.protobuf.Timestamp evaluated_at = 3;
}

message Repository {
  string id = 1;
  string name = 2;
  Organization organization = 3;
  string slug = 4;
  string description = 5;
  Logo logo = 6;
  string web_url = 7;
  string visibility = 8;
  string last_activity_at = 9;
  double rating = 10;
  Language language = 11;
}

message Language {
  string name = 1;
  string color = 2;
}

message Logo {
  string url = 1;
}

message Organization {
  string slug = 1;
}

message RepoGrade {
  string sourcecraft_uuid = 1;

  optional int32 score = 2;
  bytes category_scores = 3;
  bytes advice = 4;

  repeated string missing_data = 5;
  google.protobuf.Timestamp graded_at = 6;
}

message GetAnalyticsRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message GetAnalyticsResponse {
  bytes analytics = 1;
  google.protobuf.Timestamp graded_at = 2;
}

message RecordAuditRequest {
  // admin | user | anonymous | system.
  string actor_kind = 1;
  // Lowercase hex HMAC of the Yandex ID, up to 64 characters; empty for anonymous and system.
  string actor_hash = 2;
  // Dotted lowercase name, e.g. admin.denied.
  string action = 3;
  // "" | repo | batch | route.
  string target_kind = 4;
  // A public repo slug, an ID, a route, or a hash; never the slug of a private repo.
  string target = 5;
  // ok | denied | error.
  string outcome = 6;
  // A small JSON object of non-sensitive context; empty means {}.
  bytes details = 7;
}

message RecordAuditResponse {}

message ListAuditRequest {
  // Entries per page; 0 means 50, at most 200.
  int32 limit = 1;
  // Only entries with a smaller id; 0 means from the newest.
  int64 before_id = 2;
  // An exact action, or one ending in "." for a prefix (e.g. "admin.").
  string action = 3;
  // ok | denied | error; empty means any.
  string outcome = 4;
  // admin | users: the admin journal or the user-action entries; empty means both.
  string scope = 5;
}

message AuditEntry {
  int64 id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_kind = 3;
  string actor_hash = 4;
  string action = 5;
  string target_kind = 6;
  string target = 7;
  string outcome = 8;
  bytes details = 9;
}

message ListAuditResponse {
  repeated AuditEntry entries = 1;
  // The cursor for the next page (pass as before_id); 0 when this was the last page.
  int64 next_before_id = 2;
}

message BatchFilter {
  // Main language, matched case-insensitively.
  repeated string languages = 1;
  // Bounds of the stored public score; a repo without a grade never matches them.
  optional int32 min_score = 2;
  optional int32 max_score = 3;
  // Last grade older than this many days (or never graded).
  optional int32 older_than_days = 4;
  // Hand-picked "org/repo" slugs.
  repeated string repos = 5;
  reserved 6, 7;
  reserved "all", "top_rated";
  // Grade every selected repo, skipping the "new activity since the last grade" check.
  bool force = 8;
  // How many matching repos are graded, highest SourceCraft rating first; required, at least 1.
  int32 limit = 9;
  // Only repos that already have a public grade; otherwise never-graded repos are graded too.
  bool only_regrade = 10;
}

message PreviewGradingBatchRequest {
  BatchFilter filter = 1;
}

message PreviewGradingBatchResponse {
  // Repos the limit takes from the matches.
  int32 count = 1;
  reserved 2;
  reserved "capped";
  repeated string sample = 3;
  // Hand-picked slugs that are not public repositories known to the service.
  repeated string unmatched = 4;
  int32 estimate_seconds = 5;
  // Estimated repos the activity check will skip (0 with force).
  int32 inactive = 6;
  // Public repos the criteria match before the limit.
  int32 matched = 7;
}

message StartGradingBatchRequest {
  BatchFilter filter = 1;
  // The starting admin's actor hash, for the audit log and the batch record.
  string actor_hash = 2;
}

message StartGradingBatchResponse {
  GradingBatch batch = 1;
}

message ControlGradingBatchRequest {
  int64 batch_id = 1;
  // pause | resume | cancel.
  string action = 2;
  string actor_hash = 3;
}

message ControlGradingBatchResponse {
  GradingBatch batch = 1;
}

message GetGradingBatchRequest {
  int64 batch_id = 1;
}

message GetGradingBatchResponse {
  GradingBatch batch = 1;
  // Repos that failed, with a fixed error code; at most 100.
  repeated GradingBatchFailure failures = 2;
}

message ListGradingBatchesRequest {
  // 0 means 10, at most 50.
  int32 limit = 1;
}

message ListGradingBatchesResponse {
  repeated GradingBatch batches = 1;
  // The stand's cap on one batch's limit (BATCH_GRADING_MAX_LIMIT); 0 means none.
  int32 max_limit = 2;
}

message GradingBatch {
  int64 id = 1;
  google.protobuf.Timestamp created_at = 2;
  // Unset while the batch is unfinished.
  google.protobuf.Timestamp finished_at = 3;
  // running | paused | completed | cancelled.
  string status = 4;
  string actor_hash = 5;
  BatchFilter filter = 6;
  int32 total = 7;
  int32 pending = 8;
  int32 running = 9;
  int32 ok = 10;
  int32 failed = 11;
  int32 skipped = 12;
}

message GradingBatchFailure {
  string org_slug = 1;
  string repo_slug = 2;
  // request_failed | grading_failed | timeout | no_new_grade.
  string error = 3;
}

message GetCatalogStatusRequest {}

message GetCatalogStatusResponse {
  // Repos in the catalog in use; 0 before the first successful refresh.
  int32 size = 1;
  // When the catalog in use was stored; unset before the first successful refresh.
  google.protobuf.Timestamp updated_at = 2;
  // The running refresh, or the latest one; unset when there has never been one.
  CatalogRefresh current = 3;
  // The refresh that produced the catalog in use; unset before the first successful one.
  CatalogRefresh last_completed = 4;
}

message RefreshCatalogRequest {
  string actor_hash = 1;
}

message RefreshCatalogResponse {
  CatalogRefresh refresh = 1;
}

message CancelCatalogRefreshRequest {
  string actor_hash = 1;
}

message CancelCatalogRefreshResponse {
  CatalogRefresh refresh = 1;
}

message CatalogRefresh {
  int64 id = 1;
  google.protobuf.Timestamp started_at = 2;
  // Unset while the refresh runs.
  google.protobuf.Timestamp finished_at = 3;
  // running | completed | failed | cancelled.
  string status = 4;
  // admin | startup (the automatic first refresh of an empty catalog).
  string trigger = 5;
  string actor_hash = 6;
  int32 pages = 7;
  // Repos fetched so far; once completed, repos in the new catalog.
  int32 repos = 8;
  // wrapper_error | too_many_pages | page_loop | store_error | interrupted | empty_listing; empty otherwise.
  string error = 9;
}
