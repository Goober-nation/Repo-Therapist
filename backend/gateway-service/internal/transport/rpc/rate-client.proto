syntax = "proto3";

package rating;

option go_package = "gateway-service/internal/transport/rpc/gen/rank;rank";

import "google/protobuf/timestamp.proto";

service Rating {
  // GetRanking returns one page of the public repositories ranking. Read-only — the rating
  // service never writes to the DB.
  rpc GetRanking(GetRankingRequest) returns (GetRankingResponse);
  // GetPublicScore returns the stored public score of one public repository, for the README
  // badge. Read-only: it never starts a grading. NOT_FOUND when the repo is unknown or not public.
  rpc GetPublicScore(GetPublicScoreRequest) returns (GetPublicScoreResponse);
  // GetPublicSummary returns the stored public grade of one public repository with its category
  // scores, for the public score API and the README badges/widget. Read-only: it never starts a
  // grading. NOT_FOUND when the repo is unknown or not public.
  rpc GetPublicSummary(GetPublicSummaryRequest) returns (GetPublicSummaryResponse);
  // GetScoreHistory returns the stored public score history of one public repository, oldest
  // first (the latest 200 points). Read-only. NOT_FOUND when the repo is unknown or not public.
  rpc GetScoreHistory(GetScoreHistoryRequest) returns (GetScoreHistoryResponse);
  // GetPositionExplanation explains a public repository's place in the default (unfiltered, by
  // score) ranking. Read-only. NOT_FOUND when the repo is unknown or not public; ranked=false when
  // it has no grade yet.
  rpc GetPositionExplanation(GetPositionExplanationRequest) returns (GetPositionExplanationResponse);
  // GetPlatformAnalytics returns aggregate statistics over all graded public repositories: score
  // distribution, average score per language and per category, the most common advice items, the
  // weekly trend and the most improved repositories. Public grades only; read-only; cached briefly.
  rpc GetPlatformAnalytics(GetPlatformAnalyticsRequest) returns (GetPlatformAnalyticsResponse);
  // ListPublicGrades returns one page of the public grades, ordered by org and repo slug, for the
  // public export. Public grades only; read-only.
  rpc ListPublicGrades(ListPublicGradesRequest) returns (ListPublicGradesResponse);
}

enum SortBy {
  // Zero value, so an omitted sort_by also means score.
  SORT_BY_SCORE = 0;
  SORT_BY_LAST_ACTIVITY = 1;
  SORT_BY_LIKES = 2;
}

message GetRankingRequest {
  // 1-based page number; 0 means the first page.
  int32 page = 1;
  // Entries per page; 0 means the default (20), max 100.
  int32 page_size = 2;
  // Primary language filter, matched case-insensitively. Empty means all languages.
  string language = 3;
  // Always descending, NULLs last. Ties are broken by public_score, so health stays the dominant
  // ranking factor whichever sort is chosen.
  SortBy sort_by = 4;
  // Leave out repos whose public grade is marked low-confidence. Repos without a flag row
  // (unknown) are never left out.
  bool hide_low_confidence = 5;
  // Size bucket by lines of code: "small", "medium" or "large" (limits RANKING_SIZE_SMALL_LOC and
  // RANKING_SIZE_LARGE_LOC); empty means any. Repos whose size is unknown never match.
  string size = 6;
  // Only repos that have (true) or lack (false) a CI config file; unset means any. Repos whose
  // fact is unknown never match either value.
  optional bool has_ci = 7;
  // Only repos that have (true) or lack (false) a SECURITY.md; unset means any. Unknown never matches.
  optional bool has_security_policy = 8;
  // Case-insensitive text searched in the repository name and description; empty means any.
  string topic = 9;
}

message RankingEntry {
  // Position within the current filtered and sorted list: (page-1)*page_size + index + 1.
  int32 place = 1;
  string sourcecraft_uuid = 2;
  // Currently repo_slug — repos has no display name column yet.
  string name = 3;
  // Empty when unknown.
  string web_url = 4;
  // Unset when the repo has not been graded yet ("нет данных").
  optional int32 public_score = 5;
  // SourceCraft rating value (likes). Unset when unknown.
  optional double likes = 6;
  // Always set; name and color are empty strings when unknown.
  Language language = 7;
  // Unset when unknown.
  google.protobuf.Timestamp last_activity_at = 8;
  // Low-confidence flag of the public grade. Unset when unknown (grade stored before the flag).
  optional bool low_confidence = 9;
  // Generic pre-written reasons; empty unless low_confidence is true.
  repeated ConfidenceReason confidence_reasons = 10;
  // Score now minus the score dynamics_days ago. Unset when the repo had no grade that long ago.
  optional int32 score_change = 11;
  // Places gained (positive) or lost (negative) in this list since dynamics_days ago, among the
  // same filtered list. Only set when sorting by score and when the repo was graded back then.
  optional int32 place_change = 12;
  // How many public gradings of the repo are stored in its history.
  int32 grade_count = 13;
}

message Language {
  string name = 1;
  string color = 2;
}

message GetRankingResponse {
  repeated RankingEntry entries = 1;
  // Number of repos matching the filter across all pages.
  int32 total_count = 2;
  // Effective page and page_size after defaults were applied.
  int32 page = 3;
  int32 page_size = 4;
  // The window of score_change/place_change in days (RANKING_DYNAMICS_DAYS).
  int32 dynamics_days = 5;
}

message GetPublicScoreRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message GetPublicScoreResponse {
  // Unset when the repo has not been graded yet.
  optional int32 public_score = 1;
}

message GetPublicSummaryRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message CategoryScore {
  // Category ID as stored by grade-service (activity, issues, documentation, code_health).
  string id = 1;
  // 0-100. Unset when the category has no data ("нет данных"), which is not a bad score.
  optional int32 score = 2;
}

message GetPublicSummaryResponse {
  // Currently repo_slug.
  string name = 1;
  // Empty when unknown.
  string web_url = 2;
  // Unset when the repo has not been graded yet.
  optional int32 public_score = 3;
  // Sorted by id; empty when the repo has not been graded yet.
  repeated CategoryScore categories = 4;
  repeated string missing_data = 5;
  // Unset when the repo has not been graded yet.
  google.protobuf.Timestamp graded_at = 6;
  // Unset when unknown (no flag row).
  optional bool low_confidence = 7;
  repeated ConfidenceReason confidence_reasons = 8;
}

message ConfidenceReason {
  string code = 1;
  string text = 2;
}

message GetScoreHistoryRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

message HistoryPoint {
  google.protobuf.Timestamp graded_at = 1;
  int32 score = 2;
  // Sorted by id; a no-data category keeps its score unset.
  repeated CategoryScore categories = 3;
  // Unset when the flag was unknown for that grading.
  optional bool low_confidence = 4;
}

message GetScoreHistoryResponse {
  // Oldest first; empty when the repo has no history.
  repeated HistoryPoint points = 1;
}

message GetPositionExplanationRequest {
  string org_slug = 1;
  string repo_slug = 2;
}

// A repo next to the explained one in the ranking.
message Neighbour {
  int32 place = 1;
  string org_slug = 2;
  string name = 3;
  int32 score = 4;
  // Points between the two scores (the neighbour above is ahead by this much, the one below is
  // behind by this much); 0 means a tie broken by recent activity.
  int32 points = 5;
}

message CategoryComparison {
  string id = 1;
  int32 score = 2;
  // Median of this category over the top 10 repos that have it; unset with fewer than 3 values.
  optional int32 top10_median = 3;
  // score - top10_median; unset when top10_median is.
  optional int32 gap = 4;
}

message GetPositionExplanationResponse {
  // False when the repo has no public grade yet (nothing else is set then).
  bool ranked = 1;
  int32 place = 2;
  int32 total = 3;
  int32 score = 4;
  optional Neighbour above = 5;
  optional Neighbour below = 6;
  repeated CategoryComparison categories = 7;
  // The category with the most negative gap to the top-10 median; empty when none is below it.
  string weakest_category = 8;
}

message GetPlatformAnalyticsRequest {}

message ScoreBucket {
  // Inclusive bounds; the last bucket is 90-100.
  int32 min_score = 1;
  int32 max_score = 2;
  int32 repos = 3;
}

message LevelCount {
  // excellent (from 90), healthy (from 75), attention (from 60), at_risk (below 60).
  string level = 1;
  int32 repos = 2;
}

message LanguageStat {
  string name = 1;
  string color = 2;
  int32 repos = 3;
  double avg_score = 4;
}

message CategoryAverage {
  string id = 1;
  // Average over the repos that have data in this category (no-data is not counted as zero).
  double avg_score = 2;
  int32 repos = 3;
}

message AdviceStat {
  string category_id = 1;
  string metric_id = 2;
  // The most common priority of this item across repos.
  string priority = 3;
  // How many repos have this item in their advice.
  int32 repos = 4;
}

message TrendPoint {
  google.protobuf.Timestamp week_start = 1;
  // Average of the latest score of each repo graded that week.
  double avg_score = 2;
  int32 repos = 3;
}

message ImprovedRepo {
  string org_slug = 1;
  // Currently repo_slug.
  string name = 2;
  int32 score = 3;
  int32 past_score = 4;
  int32 change = 5;
}

message GetPlatformAnalyticsResponse {
  int32 graded_repos = 1;
  double avg_score = 2;
  double median_score = 3;
  // Ten buckets of ten points, lowest first.
  repeated ScoreBucket distribution = 4;
  repeated LevelCount levels = 5;
  // Languages with at least min_language_repos graded repos, most repos first.
  repeated LanguageStat languages = 6;
  repeated CategoryAverage categories = 7;
  // Most common advice items first.
  repeated AdviceStat top_advice = 8;
  // Oldest week first.
  repeated TrendPoint trend = 9;
  // Biggest score gain first; compared with the latest grade improved_days ago (RANKING_DYNAMICS_DAYS).
  repeated ImprovedRepo most_improved = 10;
  int32 improved_days = 11;
  int32 min_language_repos = 12;
  google.protobuf.Timestamp generated_at = 13;
}

message ListPublicGradesRequest {
  // 1-based page number; 0 means the first page.
  int32 page = 1;
  // Entries per page; 0 means the default (1000), max 1000.
  int32 page_size = 2;
}

message PublicGradeEntry {
  string org_slug = 1;
  // Currently repo_slug.
  string name = 2;
  // Empty when unknown.
  string web_url = 3;
  int32 score = 4;
  // Empty when unknown.
  string language = 5;
  optional double likes = 6;
  google.protobuf.Timestamp last_activity_at = 7;
  google.protobuf.Timestamp graded_at = 8;
  // Unset when unknown (grade stored before the flag).
  optional bool low_confidence = 9;
  // Sorted by id; a category without data has no score.
  repeated CategoryScore categories = 10;
}

message ListPublicGradesResponse {
  repeated PublicGradeEntry entries = 1;
  // Number of graded public repos across all pages.
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}
