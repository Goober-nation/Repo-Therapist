[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcecraft-llm-service"
version = "0.1.0"
description = "Documentation grading and report generation for SourceCraft Repo Health"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35,<2", "confluent-kafka>=2.12,<3", "prometheus-client>=0.20,<1", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
