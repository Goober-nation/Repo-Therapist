syntax = "proto3";

package code_health;

option go_package = "sourcecraft-wrapper-service/internal/transport/gen;pb";


import "google/protobuf/timestamp.proto";

service CodeHealth {
  rpc GetRepositoryBySlugs(GetRepositoryBySlugsRequest)
      returns (GetRepositoryBySlugsResponse);

  rpc GetRepoIDBySlugs(GetRepoIDBySlugsRequest)
      returns (GetRepoIDBySlugsResponse);

  rpc GetGitURL(GetGitURLRequest)
      returns (GetGitURLResponse);

  rpc GetCiCDRuns(GetCiCDRunsRequest)
      returns (GetCiCDRunsResponse);

  rpc GetIssues(GetIssuesRequest)
      returns (GetIssuesResponse);

  rpc GetMilestones(GetMilestonesRequest)
      returns (GetMilestonesResponse);

  rpc ListAllPublicRepos(ListAllPublicReposRequest)
      returns (ListAllPublicReposResponse);

  rpc GetMyRepos(GetMyReposRequest)
      returns (GetMyReposResponse);

  // ListTopRatedRepos returns one page (100) of all repositories sorted by SourceCraft rating,
  // highest first (GET /repos?sort_by=-rating), starting at page_token.
  rpc ListTopRatedRepos(ListTopRatedReposRequest)
      returns (ListTopRatedReposResponse);

  // ListPublicReposPage returns one page (100) of GET /repos in the platform's own order, for the
  // Aggregator's public repo catalog refresh.
  rpc ListPublicReposPage(ListPublicReposPageRequest)
      returns (ListPublicReposPageResponse);

  // GetMyOrgs lists the caller's organizations (GET /me/orgs) and picks a default:
  // the personal org (slug equal to the GET /user username), else the first one.
  rpc GetMyOrgs(GetMyOrgsRequest)
      returns (GetMyOrgsResponse);

  // GetOrgRepos returns one time-bounded batch of an organization's repos
  // (GET /orgs/{org_slug}/repos), starting at page_token.
  rpc GetOrgRepos(GetOrgReposRequest)
      returns (GetOrgReposResponse);

  // GetPullRequests returns the newest pull requests of a repository (any status), newest first.
  rpc GetPullRequests(GetPullRequestsRequest)
      returns (GetPullRequestsResponse);

  // GetPullRequestActivity returns the reviewers and comments of one pull request (first page).
  rpc GetPullRequestActivity(GetPullRequestActivityRequest)
      returns (GetPullRequestActivityResponse);

  // GetIssueComments returns the comments of one issue (first page, metadata only).
  rpc GetIssueComments(GetIssueCommentsRequest)
      returns (GetIssueCommentsResponse);
}

message GetRepoIDBySlugsRequest {
  string repo_slug = 1;
  string org_slug = 2;
}

message GetRepoIDBySlugsResponse {
  string repo_id = 1;
}

message GetGitURLRequest {
  string repo_id = 1;
}

message GetGitURLResponse {
  string http_url = 1;
  string ssh_url = 2;
}

message ListAllPublicReposRequest {}

message ListAllPublicReposResponse {
  repeated Repository repos = 1;
}

message GetMyReposRequest {}

message GetMyReposResponse {
  repeated Repository repositories = 1;
  string next_page_token = 2;
}

message GetMyOrgsRequest {}

message GetMyOrgsResponse {
  repeated UserOrganization organizations = 1;
  string default_org_slug = 2;
}

message UserOrganization {
  string id = 1;
  string slug = 2;
  string display_name = 3;
  bool personal = 4;
}

message ListTopRatedReposRequest {
  string page_token = 1;
}

message ListTopRatedReposResponse {
  repeated Repository repositories = 1;
  string next_page_token = 2;
}

message ListPublicReposPageRequest {
  string page_token = 1;
}

message ListPublicReposPageResponse {
  repeated Repository repositories = 1;
  // Empty on the last page.
  string next_page_token = 2;
}

message GetOrgReposRequest {
  string org_slug = 1;
  string page_token = 2;
}

message GetOrgReposResponse {
  repeated Repository repositories = 1;
  string next_page_token = 2;
}

message Repository {
  string id = 1;
  string name = 2;
  Organization organization = 3;
  string slug = 4;
  string description = 5;
  Logo logo = 6;
  string web_url = 7;
  string visibility = 8;
  string last_activity_at = 9;
  Rating rating = 10;
  Language language = 11;
}


message Language {
  string name = 1;
  string color = 2;
}
message Organization {
  string id = 1;
  string slug = 2;
}

message Logo {
  string url = 1;
}

message GetCiCDRunsRequest {
  string repo_id = 1;
}

message GetCiCDRunsResponse {
  repeated Run runs = 1;
  string next_page_token = 2;
}

message Run {
  string id = 1;
  string slug = 2;
  Dates dates = 3;
  string status = 4;
  repeated Workflow workflows = 5;
  string event_type = 6;
  repeated string error_messages = 7;
  Pull pull = 8;
  RunUser user = 9;
}

message Workflow {
  string id = 1;
  string slug = 2;
  string description = 3;
  Dates dates = 4;
  string status = 5;
  repeated Task tasks = 6;
  Progress progress = 7;
  string environment_id = 8;
}

message Task {
  string id = 1;
  string slug = 2;
  string description = 3;
  Dates dates = 4;
  string status = 5;
  repeated Cube cubes = 6;
  Progress progress = 7;
  Relations relations = 8;
}

message Cube {
  string id = 1;
  string slug = 2;
  Dates dates = 3;
  string status = 4;
  repeated Artifact artifacts = 5;
  Relations relations = 6;
}

message Progress {
  double percent = 1;
  Cube current_cube = 2;
}

message Artifact {
  string id = 1;
  string local_path = 2;
  Dates dates = 3;
  string status = 4;
  string download_url = 5;
}

message Relations {
  repeated Relation needs = 1;
}

message Relation {
  string id = 1;
  string slug = 2;
}

message Dates {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp finished_at = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message Pull {
  string id = 1;
  string slug = 2;
}

message RunUser {
  string id = 1;
  string slug = 2;
}

message GetIssuesRequest {
  string repo_id = 1;
}

message GetIssuesResponse {
  repeated Issue issues = 1;
  string next_page_token = 2;
}

message Issue {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  IssueStatus status = 5;
  IssueUser author = 6;
  IssueUser updated_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  IssueUser assignee = 10;
  repeated Label labels = 11;
  repeated LinkedPR linked_prs = 12;
  string priority = 13;
  string visibility = 14;
  IssueMilestone milestone = 15;
  google.protobuf.Timestamp deadline = 16;
  google.protobuf.Timestamp started_at = 17;
  google.protobuf.Timestamp completed_at = 18;
  RepositoryRef repository = 19;
}

message IssueStatus {
  string id = 1;
  string slug = 2;
  string name = 3;
  string status_type = 4;
}

message IssueUser {
  string id = 1;
  string slug = 2;
}

message Label {
  string id = 1;
  string slug = 2;
  string name = 3;
  string color = 4;
}

message LinkedPR {
  string id = 1;
  string slug = 2;
}

message IssueMilestone {
  string id = 1;
  string slug = 2;
}

message RepositoryRef {
  string id = 1;
  string slug = 2;
  Organization organization = 3;
}

message GetMilestonesRequest {
  string repo_id = 1;
}

message GetMilestonesResponse {
  repeated Milestone items = 1;
  string next_page_token = 2;
}

message Milestone {
  string id = 1;
  string name = 2;
  string slug = 3;
  string description = 4;
  google.protobuf.Timestamp start_date = 5;
  google.protobuf.Timestamp deadline = 6;
  string status = 7;
  MilestoneUser author = 8;
  MilestoneUser updated_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message MilestoneUser {
  string id = 1;
  string slug = 2;
}

message GetRepositoryBySlugsRequest {
  string repo_slug = 1;
  string org_slug = 2;
}
message Rating {
  double value = 1;
  double percentile = 2;
  repeated ReactionCount reaction_counts = 3;
}

message ReactionCount {
  string type = 1;
  string count = 2;
}
message GetRepositoryBySlugsResponse {
  string id = 1;
  string name = 2;
  Organization organization = 3;
  string slug = 4;
  string description = 5;
  Logo logo = 6;
  string web_url = 7;
  string visibility = 8;
  string last_activity_at = 9;
  Rating rating = 10;
  Language language = 11;
}

message GetPullRequestsRequest {
  string repo_id = 1;
  // How many of the newest pull requests to return; 0 or above 100 means 100.
  int32 limit = 2;
}

message GetPullRequestsResponse {
  repeated PullRequest pull_requests = 1;
}

message PullRequest {
  string id = 1;
  string slug = 2;
  // draft, open, discarded, merging or merged.
  string status = 3;
  PullRequestUser author = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message PullRequestUser {
  string id = 1;
  string slug = 2;
}

message GetPullRequestActivityRequest {
  string pull_request_id = 1;
}

message GetPullRequestActivityResponse {
  repeated PullRequestReviewer reviewers = 1;
  repeated PullRequestComment comments = 2;
}

message PullRequestReviewer {
  PullRequestUser user = 1;
  // approve, trust, block or abstain.
  string review_decision = 2;
  google.protobuf.Timestamp created_at = 3;
}

// Metadata only: the comment text is never requested into the export.
message PullRequestComment {
  PullRequestUser author = 1;
  google.protobuf.Timestamp created_at = 2;
  // default or appsec.
  string type = 3;
  bool is_deleted = 4;
  bool is_published = 5;
}

message GetIssueCommentsRequest {
  string issue_id = 1;
}

message GetIssueCommentsResponse {
  repeated IssueCommentMeta comments = 1;
}

// Metadata only: the comment text is never requested into the export.
message IssueCommentMeta {
  IssueUser author = 1;
  google.protobuf.Timestamp created_at = 2;
}
