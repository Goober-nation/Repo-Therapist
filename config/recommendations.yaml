# Recommendation catalog — one entry per metric ID, appended to a repo's recommendation list
# whenever that metric scores below perfect (see internal/scoring/recommendations.go). First
# draft only, written from each metric's own doc description in docs/grading/ — needs review
# before treating as real user-facing copy, not yet calibrated against real repo feedback.

# --- Activity (docs/grading/activity.md) ---
commits_per_week: "[low] Коммитов мало по сравнению со здоровым темпом для этого репозитория. Проверьте, не мешают ли регулярным изменениям вопросы владения кодом или барьеры для участников."
days_since_last_activity: "[medium] В репозиторий давно не было коммитов. Если проект ещё жив, даже небольшой свежий коммит это покажет."
unique_contributors: "[medium] Коммиты делает мало разных участников. Зависимость от узкого круга людей повышает риски, если кто-то из них станет недоступен."
issue_rate_per_week: "[low] Задачи (issues) открываются редко по сравнению со здоровым темпом. Низкая активность в задачах может означать плохую видимость реальных проблем, а не здоровый бэклог."
milestones_per_year: "[low] Вехи (milestones) создаются редко. Регулярные вехи помогают показывать пользователям и участникам направление и прогресс проекта."
days_since_last_milestone: "[low] Последняя веха закрыта давно. Недавно закрытая веха показывает, что проект движется к конкретным целям."
top_contributor_share: "[high] Коммиты сосредоточены у одного участника. Это риск «фактора автобуса» — распределите владение кодом между большим числом людей."

# --- Issues (docs/grading/issues.md) ---
abandoned_share: "[medium] Большая доля открытых задач давно не обновлялась. Разбор или закрытие устаревших задач улучшит состояние бэклога и доверие участников."
median_closure_days: "[medium] Задачи в среднем закрываются долго. Более быстрый разбор и решение задач улучшат опыт участников."
growth_ratio: "[high] Задачи открываются быстрее, чем закрываются. Без контроля это приведёт к неуправляемому бэклогу."
share_resolved: "[medium] Решается лишь небольшая доля задач из бэклога. Выделите время на закрытие старых задач."

# --- Code health (docs/grading/code-health.md) ---
median_marker_age: "[low] Маркеры TODO/FIXME в коде подолгу остаются без внимания. Периодически пересматривайте и устраняйте старые маркеры."
density_per_kloc: "[medium] Плотность маркеров TODO/FIXME относительно размера кода высокая. Стоит погасить часть этого технического долга."
share_stale_markers: "[low] Большая доля маркеров TODO/FIXME старше типичного. К ним стоит вернуться — старый маркер может означать забытую задачу, а не просто низкий приоритет."
worst_file_concentration: "[low] Маркеры TODO/FIXME сильно сконцентрированы в одном файле. Этот файл — хороший кандидат для точечной чистки или рефакторинга."

# --- Security (docs/grading/security.md; metric IDs hardcoded in internal/scoring/security.go) ---
open_critical: "[critical] Есть открытые уязвимости критического уровня. Это самый срочный риск безопасности, их нужно устранить в первую очередь."
open_high: "[high] Есть открытые уязвимости высокого уровня. Их следует устранить сразу после критических."
open_medium: "[medium] Есть открытые уязвимости среднего уровня — запланируйте время на их устранение."
open_low: "[low] Есть открытые уязвимости низкого уровня. Это не срочно, но их стоит отслеживать, чтобы они не накапливались."
days_since_last_scan: "[high] Последнее сканирование безопасности было давно. Свежее сканирование покажет актуальное состояние кода."

# --- CI/CD (docs/grading/ci-cd.md) ---
has_ci: "[critical] CI-пайплайн не найден. Добавьте .sourcecraft/ci.yaml, который собирает и тестирует каждое изменение, — так регрессии будут отлавливаться до попадания в основную ветку."
ci_success_rate: "[high] Большая доля запусков CI завершается ошибкой. Исправьте или изолируйте падающие проверки, чтобы CI оставался надёжным сигналом, а не шумом."
ci_stability_trend: "[medium] В последнее время CI падает чаще, чем раньше. Разберитесь, что изменилось в недавних упавших запусках, пока падения не стали нормой."
ci_noop_pipeline: "[high] CI-пайплайн выполняет только команды-заглушки (echo, true, sleep...) и никогда не собирает и не тестирует код. Замените их реальными шагами сборки и тестирования, чтобы CI действительно ловил регрессии."
ci_median_duration_min: "[low] Запуски CI идут долго. Кэширование зависимостей или разделение медленных задач сократит цикл обратной связи для участников."
