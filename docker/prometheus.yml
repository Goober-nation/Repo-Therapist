# Scrape config of the monitoring stack (docs/metrics.md). The Go services share one container, each with
# its own metrics port; the ports are not published.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["go-services:9101"]
  - job_name: aggregator
    static_configs:
      - targets: ["go-services:9102"]
  - job_name: rating
    static_configs:
      - targets: ["go-services:9103"]
