services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repotherapist
      POSTGRES_PASSWORD: repotherapist
      POSTGRES_DB: repotherapist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: repotherapist
      MINIO_ROOT_PASSWORD: repotherapist123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
