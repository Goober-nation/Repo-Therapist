services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "8051:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio: # S3 storage; RustFS (MinIO-compatible) since MinIO stopped publishing images
    image: rustfs/rustfs:1.0.1-preview.11
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "8054:9000" # S3 API
      - "8055:9001" # web console
    volumes:
      - s3data:/data

  # Gateway sessions and rate limiting; private grading tokens (grading:token:<job_id>).
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # Loopback only: host-run services and the manual grading-request tool still reach it,
    # other machines do not.
    ports:
      - "127.0.0.1:8052:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      # Single-node KRaft mode — Kafka acts as its own metadata quorum, no Zookeeper container.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # INTERNAL for containers (kafka:29092), EXTERNAL for the host only (localhost:8053).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:8053
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Default heap is 1G; a single dev broker with small messages needs far less.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    # Loopback only: plaintext, unauthenticated listener for host-run services and debugging.
    ports:
      - "127.0.0.1:8053:9092"
    volumes:
      # The apache/kafka image's log.dirs; anything else leaves data on an anonymous volume lost on recreate.
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  go-services:
    build:
      context: .
      dockerfile: docker/go-services.Dockerfile
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: minio:9000
      SERVICE_TOKEN: ${SOURCECRAFT_PAT}
      SC_WRAPPER_ADDR: localhost:8082
      WRAPPER_GRPC_ADDRESS: localhost:8082
      SECURITY_WRAPPER_ADDR: localhost:8085
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
      AGGREGATOR_GRPC_ADDRESS: localhost:8083
      RATING_GRPC_ADDRESS: localhost:8086
      # Gateway requests per client IP per minute (code default 10 is too low for the SPA's polling).
      RATE_LIMIT: ${RATE_LIMIT:-60}
      # Public JSON score API (GET /score/...): its own per-IP budget; badges and the widget are not limited.
      PUBLIC_API_RATE_LIMIT: ${PUBLIC_API_RATE_LIMIT:-300}
      PUBLIC_API_RATE_LIMIT_WINDOW: ${PUBLIC_API_RATE_LIMIT_WINDOW:-1m}
    # Clones go to /dev/shm first; repository-service retries on disk if a repo outgrows it.
    shm_size: 400m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  llm-service:
    build: backend/llm-service
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: minio:9000
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  llm-summary-service:
    build: backend/llm-service
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
    command: ["python", "-m", "llm_service", "--listen-summary"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        VITE_YANDEX_CLIENT_ID: ${VITE_YANDEX_CLIENT_ID:-}
    ports:
      - "8081:80"
    depends_on:
      - go-services

volumes:
  pgdata:
  s3data:
  kafkadata:
