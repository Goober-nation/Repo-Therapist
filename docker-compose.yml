services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
      # Soft cap: MinIO otherwise grows caches to fit available memory. GC works harder near it; never OOM-kills.
      GOMEMLIMIT: 256MiB
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data

  # Gateway sessions and rate limiting.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    environment:
      # Single-node KRaft mode — Kafka acts as its own metadata quorum, no Zookeeper container.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # INTERNAL for containers (kafka:29092), EXTERNAL for the host (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Default heap is 1G; a single dev broker with small messages needs far less.
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    ports:
      - "9092:9092"
    volumes:
      # The apache/kafka image's log.dirs; anything else leaves data on an anonymous volume lost on recreate.
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      retries: 12

  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path", "/migrations", "-database", "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable", "up"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  go-services:
    build:
      context: .
      dockerfile: docker/go-services.Dockerfile
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: minio:9000
      SC_WRAPPER_ADDR: localhost:8082
      WRAPPER_GRPC_ADDRESS: localhost:8082
      SECURITY_WRAPPER_ADDR: localhost:8085
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    # Clones go to /dev/shm first; repository-service retries on disk if a repo outgrows it.
    shm_size: 400m
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  llm-service:
    build: backend/llm-service
    env_file: .env
    environment:
      KAFKA_BROKERS: kafka:29092
      S3_ENDPOINT: minio:9000
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: frontend
    ports:
      - "8081:80"
    depends_on:
      - go-services

volumes:
  pgdata:
  miniodata:
  kafkadata:
