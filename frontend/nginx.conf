server {
    listen 80;
    root /usr/share/nginx/html;

    location = /yandex-profile/info {
        limit_except GET { deny all; }
        proxy_pass https://login.yandex.ru/info;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host login.yandex.ru;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 15s;
    }

    location = /auth/yandex/token.html {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        access_log off;
        try_files $uri =404;
    }

    # gateway-service runs in the go-services container on port 8080.
    location /api/ {
        proxy_pass http://go-services:8080/;
        # Gateway rate-limits per client; without this every user shares nginx's address.
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
